{% extends "base.html" %}
{% block title %}{{ document.name }} -- Dynamics 365 (Mirror){% endblock %}
{% block content %}
  <section id="section-document-detail" class="record-section">
    <h1 id="document-name-heading">{{ document.name }}</h1>
    <div class="field-group">
      <label for="field-document-content">Content</label>
      <div id="field-document-content" class="field-readonly">{{ document.content or "(no readable content for this document in the mirror)" }}</div>
    </div>
    <a href="{{ url_for('contact_view', contact_id=contact.id) }}" id="link-back-to-contact">Back to Contact</a>
  </section>
{% endblock %}

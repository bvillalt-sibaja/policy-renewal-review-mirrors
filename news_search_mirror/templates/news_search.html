<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Search (Mirror)</title>
  <style>
    body { font-family: Arial, "Segoe UI", sans-serif; margin: 0; background: #fff; color: #202124; font-size: 14px; }
    .search-bar { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-bottom: 1px solid #ebebeb; }
    #search-input { flex: 1; max-width: 560px; padding: 9px 14px; border: 1px solid #dfe1e5; border-radius: 20px; font-size: 15px; }
    button { padding: 8px 16px; border: 1px solid #dfe1e5; background: #f8f9fa; color: #3c4043; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .tabs { display: flex; gap: 20px; padding: 0 24px; border-bottom: 1px solid #ebebeb; }
    .tab { padding: 12px 4px; color: #5f6368; cursor: pointer; border-bottom: 2px solid transparent; background: none; border-radius: 0; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
    #search-results { padding: 20px 24px; max-width: 640px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="search-bar">
    <form id="form-search" action="{{ url_for('search') }}" method="post" style="display:flex; gap:10px; flex:1;">
      <input type="text" id="search-input" name="query" placeholder="Search" value="{{ state.query }}" autocomplete="off">
      <button type="submit" id="btn-search">Search</button>
    </form>
  </div>
  <div class="tabs">
    <span class="tab {{ 'active' if not state.news_tab else '' }}">All</span>
    <form id="form-news-tab" action="{{ url_for('news_tab') }}" method="post" style="display:inline;">
      <button type="submit" id="tab-news" class="tab {{ 'active' if state.news_tab else '' }}">News</button>
    </form>
  </div>
  {% if state.news_tab %}
  <div id="search-results">{{ state.results }}</div>
  {% endif %}
</body>
</html>
